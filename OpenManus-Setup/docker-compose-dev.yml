version: '3.8'

services:
  openmanus-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: openmanus-dev
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-claude-3-7-sonnet-20250219}
    volumes:
      - .:/workspace
      - /workspace/.git
    ports:
      - "8000:8000"
      - "5678:5678"
    stdin_open: true
    tty: true
    command: /bin/bash
    networks:
      - openmanus-dev-network

networks:
  openmanus-dev-network:
    driver: bridge
