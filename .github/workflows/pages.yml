name: Deploy Pages PWA bundle

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate static bundle
        run: |
          test -f index.html || { echo "::error::index.html missing"; exit 1; }
          test -f sw.js || { echo "::error::sw.js missing"; exit 1; }
          test -f manifest.webmanifest || { echo "::error::manifest.webmanifest missing"; exit 1; }

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking GitHub Pages configuration..."
          # Check if GitHub Pages is enabled
          PAGES_STATUS=$(gh api "repos/${{ github.repository }}/pages" --jq '.status' 2>/dev/null || echo "not_configured")
          echo "Current GitHub Pages status: $PAGES_STATUS"
          
          if [ "$PAGES_STATUS" = "not_configured" ]; then
            echo "::warning::GitHub Pages is not configured. Please enable it in repository settings -> Pages -> Source: GitHub Actions"
            # Enable Pages with GitHub Actions source
            gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow || echo "Could not enable GitHub Pages - may require manual configuration"
          fi
          
          # Ensure the deployment target is correct
          gh api -X POST "repos/${{ github.repository }}/pages/deployment" -H "Accept: application/vnd.github+json" || echo "Deployment target update skipped"

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
